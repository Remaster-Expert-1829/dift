name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-check tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 clang-18 clang-tidy-18 clang-format-18 python3
      - name: Validate dependency lock and notices
        run: python3 scripts/check-dependencies.py
      - name: Validate exact toolchain
        run: python3 scripts/check-toolchain.py
      - name: Test quality validators
        run: python3 -m unittest discover --start-directory tests/scripts --pattern 'test_*.py'
      - name: Validate documentation links and IDs
        run: python3 scripts/check-docs.py
      - name: Verify formatting
        run: git ls-files '*.cpp' '*.h' | xargs --no-run-if-empty clang-format-18 --dry-run --Werror

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate pinned toolchain families
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 clang-18 clang-tidy-18 clang-format-18 python3 && python3 scripts/check-toolchain.py
      - name: Bootstrap pinned vcpkg
        run: bash cmake/bootstrap-vcpkg.sh
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Install and smoke test release package
        if: matrix.preset == 'release'
        run: cmake --install out/build/release --prefix "$PWD/out/install" && "$PWD/out/install/bin/spoink" version

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate pinned toolchain families
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 clang-18 clang-tidy-18 clang-format-18 python3 && python3 scripts/check-toolchain.py
      - name: Bootstrap pinned vcpkg
        run: bash cmake/bootstrap-vcpkg.sh
      - name: Configure and build with clang-tidy
        run: cmake --preset clang-tidy && cmake --build --preset clang-tidy
      - name: Verify project-header analysis gate
        run: python3 scripts/verify-clang-tidy-header-gate.py

  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate pinned toolchain families
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc-13 g++-13 clang-18 clang-tidy-18 clang-format-18 python3 && python3 scripts/check-toolchain.py
      - name: Bootstrap pinned vcpkg
        run: bash cmake/bootstrap-vcpkg.sh
      - name: Configure, build, and test with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cmake --preset sanitize && cmake --build --preset sanitize && ctest --preset sanitize

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
